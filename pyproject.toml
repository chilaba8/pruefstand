[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruefstand"
version = "1.0.0"
description = "Passiver Sicherheits-Check für Domains (E-Mail/DNS) mit Bericht auf Deutsch – für KMU und IT-Dienstleister"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.4",
    "rich>=13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pruefstand = "pruefstand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
