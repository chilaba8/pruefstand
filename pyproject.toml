[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruefstand"
version = "1.1.0"
description = "Passiver Sicherheits-Check für Domains (E-Mail/DNS) mit Bericht auf Deutsch – für KMU und IT-Dienstleister"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Juan Amorós García" }]
keywords = ["dmarc", "spf", "dkim", "email-security", "dns", "security-audit", "kmu", "switzerland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = [
    "dnspython>=2.4",
    "rich>=13",
    "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/chilaba8/pruefstand"
Issues = "https://github.com/chilaba8/pruefstand/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pruefstand = "pruefstand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
